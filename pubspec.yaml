name: mesh_analyzer
description: "Meshurement - maps LoRa mesh radio coverage"
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1

  # BLE / Meshtastic protocol
  protobuf: ^4.2.0 # runtime for the vendored Meshtastic protos (lib/proto)
  fixnum: ^1.1.1
  flutter_blue_plus: ^1.36.0
  permission_handler: ^12.0.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (drift)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Maps
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  http: ^1.2.2

  # GPS
  geolocator: ^13.0.2

  # Utilities
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.4
  csv: ^6.0.0
  intl: ^0.19.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  uuid: ^4.5.1
  url_launcher: ^6.3.3
  package_info_plus: ^9.0.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.13+2
  archive: ^4.5.2
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  xml: ^6.6.1

flutter:
  uses-material-design: true
  assets:
    - NOTICE
    - lib/proto/LICENSE
    - assets/fonts/OFL-B612.txt
    - assets/fonts/OFL-CourierPrime.txt
    - assets/fonts/OFL-Fredoka.txt
    - assets/brand/splash.png
    - assets/brand/wordmark.png
  # B612 (Airbus / PolarSys, SIL OFL 1.1): the app typeface, see
  # docs/design/theme.md. Only Regular and Bold exist.
  fonts:
    - family: B612
      fonts:
        - asset: assets/fonts/B612-Regular.ttf
        - asset: assets/fonts/B612-Italic.ttf
          style: italic
        - asset: assets/fonts/B612-Bold.ttf
          weight: 700
        - asset: assets/fonts/B612-BoldItalic.ttf
          weight: 700
          style: italic
    - family: B612Mono
      fonts:
        - asset: assets/fonts/B612Mono-Regular.ttf
        - asset: assets/fonts/B612Mono-Bold.ttf
          weight: 700
    # Field Report styles only: Mission (typewriter) and Pop (rounded).
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    # Variable font (wght 300-700): set FontVariation('wght', …) with the weight.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf

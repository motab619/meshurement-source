<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meshurement Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Familjen+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f4;
  --bg-cream: #f3ede2;
  --paper: #fffdf9;
  --ink: #261f15;
  --ink-2: #5c4f3c;
  --muted: #6f6047;
  --border: #e2d9c9;
  --border-strong: #cdbfa8;
  --accent: #ff6000;
  --accent-ink: #b34000;
  --pass: #3f9a3a;
  --pass-ink: #2c6e28;
  --danger: #a3271b;
  --ble: #3b6ea8;
  --wood: #c9a77c;
  --heading: "Familjen Grotesk", system-ui, -apple-system, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
::selection { background: rgba(255, 96, 0, 0.16); }

/* header: hairline, wordmark, run facts */
header {
  background: var(--paper);
  border-bottom: 1px solid var(--border);
}
.bar {
  max-width: 1440px; margin: 0 auto; padding: 12px 24px;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.wordmark { font-family: var(--heading); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.015em; }
.wordmark span { color: var(--accent-ink); }
.facts { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 0.86rem; }
.facts b { color: var(--ink-2); font-weight: 600; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); display: inline-block; }
.conn.live i { background: var(--pass); box-shadow: 0 0 0 0 rgba(63,154,58,.5); animation: beat 2s infinite; }
.conn.lost i { background: var(--danger); }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(63,154,58,.45); } 70% { box-shadow: 0 0 0 8px rgba(63,154,58,0); } 100% { box-shadow: 0 0 0 0 rgba(63,154,58,0); } }

main {
  max-width: 1440px; margin: 0 auto; padding: 20px 24px 32px;
  display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(340px, 1fr); gap: 28px;
  align-items: start;
}
@media (max-width: 980px) {
  main { grid-template-columns: 1fr; padding: 16px; gap: 20px; }
  .bar { padding: 10px 16px; gap: 12px; }
  .conn { margin-left: 0; }
}

.kicker {
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.kicker::before { content: ""; width: 14px; height: 2px; background: var(--accent); display: inline-block; }

/* the bench drawing */
.stage-wrap { position: sticky; top: 16px; }
.stage {
  background: var(--paper); border: 1px solid var(--border); border-radius: 3px;
  position: relative; overflow: hidden;
}
.stage svg { display: block; width: 100%; height: auto; }
.now {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px;
}
.now h1 { font-family: var(--heading); font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.2rem); margin: 0; letter-spacing: -0.015em; line-height: 1.1; }
.now p { margin: 0; color: var(--ink-2); }

.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
.legend .usb i { border-color: var(--ink-2); }
.legend .ble i { border-color: var(--ble); border-top-style: dashed; }
.legend .lora i { border-color: var(--accent); border-top-style: dotted; border-top-width: 4px; }

.ticker {
  margin-top: 12px; font-family: var(--mono); font-size: 0.74rem; color: var(--muted);
  border-top: 1px solid var(--border); padding-top: 8px; min-height: 7.4em;
}
.ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .4s; }
.ticker div:last-child { color: var(--ink); }

/* SVG parts */
.ink { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.cable { fill: none; stroke: #8b7c66; stroke-width: 4; stroke-linecap: round; transition: stroke .3s; }
.cable.hot { stroke: var(--ink-2); }
.lbl { font: 600 15px var(--body); fill: var(--ink); }
.sm { font: 500 12.5px var(--body); fill: var(--ink-2); }
.tiny { font: 500 10.5px var(--mono); fill: var(--muted); }
.radio { transition: opacity .5s; }
.radio.dim { opacity: 0.35; }
.radio .body { transition: transform .2s; transform-box: fill-box; transform-origin: center bottom; }
.radio.busy .body { animation: wiggle .5s ease-in-out infinite alternate; }
@keyframes wiggle { from { transform: rotate(-0.8deg); } to { transform: rotate(0.8deg); } }
.radio.fail .body, .phone.fail { animation: shake .45s ease-in-out 2; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.phone { transform-box: fill-box; }
.blelink { fill: none; stroke: var(--ble); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; opacity: 0; transition: opacity .4s; }
.blelink.on { opacity: 1; animation: march 0.9s linear infinite; }
.blelink.solid { opacity: .55; animation: march 2.4s linear infinite; }
@keyframes march { to { stroke-dashoffset: -22; } }
.ring { fill: none; stroke-width: 3; }
.spin { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.stamp { transform-box: fill-box; transform-origin: center; animation: stamp .55s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: scale(2.4) rotate(-14deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.pop { transform-box: fill-box; transform-origin: center; animation: pop 1.3s ease-out both; }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 18% { transform: scale(1.15); opacity: 1; } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
.screen-flash { animation: sflash .6s ease-out; }
@keyframes sflash { from { fill: #fff3e6; } to { fill: #dfeef7; } }

/* checklist */
.panel {
  background: var(--paper); border: 1px solid var(--border); border-radius: 3px;
  position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
}
#list { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
@media (max-width: 980px) { .panel, .stage-wrap { position: static; max-height: none; } }
.summary { padding: 18px 20px 16px; border-bottom: 1px solid var(--border); }
.count { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.count .big { font-family: var(--heading); font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.count .of { color: var(--muted); font-size: 1rem; }
.count .clock { margin-left: auto; font-family: var(--mono); font-size: 1.05rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--bg-cream); border-radius: 4px; overflow: hidden; margin-top: 12px; position: relative; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .6s cubic-bezier(.3,.9,.3,1), background .4s; }
.fill.done { background: var(--pass); }
.fill.bad { background: var(--danger); }
.tally { display: flex; gap: 16px; margin-top: 10px; font-size: 0.84rem; color: var(--muted); }
.tally b { font-variant-numeric: tabular-nums; }
.tally .p b { color: var(--pass-ink); }
.tally .f b { color: var(--danger); }

.combos { display: none; gap: 8px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.combos.on { display: flex; }
.combo { font-size: 0.78rem; padding: 3px 9px; border-radius: 3px; border: 1px solid var(--border-strong); color: var(--ink-2); }
.combo.running { border-color: var(--accent); color: var(--accent-ink); }
.combo.pass { background: #e7f2e3; border-color: var(--pass); color: var(--pass-ink); }
.combo.fail, .combo.blocked { background: #f7e4e1; border-color: var(--danger); color: var(--danger); }

.scen { border-top: 1px solid var(--border); }
.scen:first-child { border-top: 0; }
.shead { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 14px 20px; cursor: pointer; }
.shead:hover h3 { color: var(--accent-ink); }
.shead h3 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.3; }
.shead p { margin: 2px 0 0; font-size: 0.84rem; color: var(--muted); }
.shead .slug { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.shead .dur { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); text-align: right; white-space: nowrap; padding-top: 2px; }
.scen.running { background: linear-gradient(90deg, rgba(255,96,0,.06), transparent 60%); }
.checks { list-style: none; margin: 0; padding: 0 20px 12px 62px; display: none; }
.scen.open .checks { display: block; }
.checks li {
  display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start;
  padding: 4px 0; font-size: 0.86rem; color: var(--ink-2); border-radius: 2px;
}
.checks li.pending { color: #b3a68f; }
.checks li.new { animation: arrive .9s ease-out; }
@keyframes arrive { 0% { background: #ffe8d6; transform: translateX(-6px); } 100% { background: transparent; transform: none; } }
.checks li.bad { color: var(--danger); }
.checks .detail { display: block; font-family: var(--mono); font-size: 0.72rem; color: var(--danger); opacity: .85; word-break: break-word; }
.more { font-size: 0.78rem; color: var(--muted); padding: 2px 0 0; }

.icon { width: 30px; height: 30px; display: block; }
.icon.small { width: 18px; height: 18px; margin-top: 1px; }
.draw { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .45s ease-out .1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.instant .draw, .instant.draw { animation-duration: 0s; animation-delay: 0s; }

.empty { padding: 28px 20px; color: var(--muted); }
.again {
  display: none; margin: 14px 20px 18px; font: 600 0.9rem var(--body); color: var(--paper);
  background: var(--ink); border: 0; border-radius: 3px; padding: 10px 16px; cursor: pointer;
}
.again.on { display: inline-block; align-self: flex-start; }
.again:hover { background: var(--accent-ink); }
button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="wordmark">Meshurement <span>Bench</span></div>
    <div class="facts" id="facts"><span>waiting for a run…</span></div>
    <div class="conn" id="conn"><i></i><span>connecting</span></div>
  </div>
</header>

<main>
  <section class="stage-wrap" aria-label="The bench">
    <div class="kicker" id="kicker">Hardware test</div>
    <div class="now">
      <h1 id="nowTitle">Waiting for the bench</h1>
      <p id="nowSub">Start a run with <code>bench run all --ui</code></p>
    </div>
    <div class="stage">
      <svg id="stage" viewBox="0 0 900 560" role="img" aria-labelledby="stageT">
        <title id="stageT">The test bench: a Mac, the phone and the radios, joined by USB cables</title>
        <defs>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <rect width="900" height="560" fill="#fffdf9"/>
        <!-- table -->
        <path d="M24 478 H876" stroke="#c9a77c" stroke-width="14" stroke-linecap="round"/>
        <path d="M74 486 V552 M826 486 V552" stroke="#c9a77c" stroke-width="11" stroke-linecap="round"/>
        <g id="cables"></g>
        <g id="links"></g>
        <!-- Mac -->
        <g id="mac">
          <rect x="40" y="312" width="190" height="122" rx="10" fill="#261f15"/>
          <rect x="50" y="322" width="170" height="102" rx="4" fill="#1d2430"/>
          <g id="term" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9fd39a"></g>
          <path d="M22 436 H248 L238 466 H32 Z" fill="#cfc6b6" stroke="#261f15" stroke-width="3" stroke-linejoin="round"/>
          <rect x="112" y="440" width="46" height="5" rx="2" fill="#a99f8e"/>
          <text class="lbl" x="135" y="300" text-anchor="middle">Mac</text>
          <text class="tiny" x="135" y="286" text-anchor="middle" id="macSub">bench orchestrator</text>
        </g>
        <g id="radios"></g>
        <!-- phone -->
        <g id="phone" class="phone">
          <path d="M704 300 V470" stroke="#8b7c66" stroke-width="9" stroke-linecap="round"/>
          <path d="M670 472 H738" stroke="#261f15" stroke-width="7" stroke-linecap="round"/>
          <path d="M686 300 h36 v-10 h-36 z" fill="#8b7c66" stroke="#261f15" stroke-width="2"/>
          <rect x="640" y="52" width="128" height="250" rx="20" fill="#261f15"/>
          <rect id="screen" x="648" y="66" width="112" height="222" rx="12" fill="#dfeef7"/>
          <rect x="684" y="57" width="40" height="5" rx="2.5" fill="#4a4036"/>
          <text x="704" y="88" text-anchor="middle" font-family="Familjen Grotesk, system-ui" font-weight="700" font-size="12" fill="#261f15">Meshurement</text>
          <rect x="682" y="94" width="44" height="13" rx="3" fill="#ff6000"/>
          <text x="704" y="104" text-anchor="middle" font-family="DM Sans, system-ui" font-weight="700" font-size="8.5" fill="#fff">BENCH</text>
          <g id="phoneIcon" transform="translate(704 160)"></g>
          <text id="ph1" x="704" y="214" text-anchor="middle" font-family="DM Sans, system-ui" font-weight="700" font-size="11" fill="#261f15"></text>
          <text id="ph2" x="704" y="228" text-anchor="middle" font-family="DM Sans, system-ui" font-weight="700" font-size="11" fill="#261f15"></text>
          <text id="ph3" x="704" y="250" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#5c4f3c"></text>
          <text id="ph4" x="704" y="262" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#5c4f3c"></text>
          <g id="pairDlg" opacity="0">
            <rect x="656" y="128" width="96" height="62" rx="8" fill="#fffdf9" stroke="#261f15" stroke-width="1.5"/>
            <text x="704" y="148" text-anchor="middle" font-family="DM Sans, system-ui" font-weight="700" font-size="9.5" fill="#261f15">Bluetooth Pairing</text>
            <rect x="672" y="160" width="64" height="20" rx="5" fill="#3b6ea8"/>
            <text x="704" y="174" text-anchor="middle" font-family="DM Sans, system-ui" font-weight="700" font-size="10" fill="#fff">Pair</text>
          </g>
        </g>
        <text class="lbl" x="704" y="508" text-anchor="middle" id="phoneName">Phone</text>
        <text class="sm" x="704" y="525" text-anchor="middle" id="phoneSub"></text>
        <g id="fx"></g>
        <g id="stampLayer"></g>
      </svg>
    </div>
    <div class="legend">
      <span class="usb"><i></i>USB (Mac reads and flashes radios)</span>
      <span class="ble"><i></i>Bluetooth (phone ↔ radio)</span>
      <span class="lora"><i></i>LoRa (radio ↔ radio)</span>
    </div>
    <div class="ticker" id="ticker" aria-live="off"></div>
  </section>

  <section aria-label="Checklist">
    <div class="panel">
      <div class="summary">
        <div class="kicker">Checks</div>
        <div class="count">
          <span class="big" id="done">0</span>
          <span class="of" id="of">of 0</span>
          <span class="clock" id="clock">00:00</span>
        </div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="tally">
          <span class="p"><b id="nPass">0</b> passed</span>
          <span class="f"><b id="nFail">0</b> failed</span>
          <span><b id="nScen">0/0</b> scenarios</span>
        </div>
      </div>
      <div class="combos" id="combos"></div>
      <div id="list"><div class="empty">The checklist appears when a run starts.</div></div>
      <button class="again" id="again" type="button">Play the replay again</button>
    </div>
  </section>
</main>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const html = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// What each scenario is, in words (bench/scenarios/*.py docstrings).
const SCEN = {
  "smoke": ["Smoke test", "The bench server end to end in demo mode, no radios"],
  "radio-setup": ["Radio Setup", "The phone sets up base and mobile over Bluetooth; the Mac reads both back over USB"],
  "public-channel-refusal": ["Public channel refusal", "Mobile put back on the public key: a session must refuse to start"],
  "recorded-session": ["Recorded session", "Pings, beacons, out of range and radio lost, with USB stand-ins"],
  "pki-recovery": ["Key recovery", "The base forgets our key: a NAK, then pings are answered again"],
  "remote-base-change": ["Remote base change", "The mobile changes the base's settings over the air"],
  "exports": ["Exports", "Session CSV and maps.json match the database"],
  "backups": ["Backups", "Restore the mobile's original settings from its backup"],
  "radio-setup-meshcore": ["Radio Setup · MeshCore", "The MeshCore pair on the test channel, checked through the app"],
  "meshcore-session": ["MeshCore session", "Link checks (traces) between the MeshCore pair"],
};
const BOARD = { "heltec-v3": "Heltec V3", "t1000-e": "T1000-E", "wio-tracker-l1": "Wio Tracker L1" };

// ---------------------------------------------------------------- state
let S;
function fresh() {
  return {
    run: null, radios: {}, order: [], scen: {}, current: null, t0: null, tEnd: null,
    pass: 0, fail: 0, total: 0, bleTarget: null, combos: [], replayOf: "",
  };
}
S = fresh();
let instant = false;      // applying the backlog after a (re)connect: no animation

// ---------------------------------------------------------------- drawing the bench
const K = 1.3;                       // radio drawing scale
const PHONE_X = 790;
const LAYOUT = { 1: [450], 2: [390, 570], 3: [340, 470, 600], 4: [315, 430, 545, 660] };
const PHONE_PORT = [PHONE_X, 302];
const MAC_PORT = [238, 450];

function drawBench(radios) {
  const g = $("radios"), cables = $("cables");
  g.replaceChildren(); cables.replaceChildren(); $("links").replaceChildren();
  S.radios = {};
  // Base first, then mobile, Meshtastic before MeshCore: base left, mobile right.
  const names = Object.keys(radios).sort((a, b) => rank(radios[a]) - rank(radios[b]));
  const phoneX = PHONE_X;
  movePhone(phoneX);
  const xs = LAYOUT[Math.min(4, names.length)] || [];
  names.slice(0, 4).forEach((name, i) => {
    const r = radios[name];
    const [x, y] = [xs[i], 471];
    const node = drawRadio(g, name, r, x, y);
    const cable = el("path", { class: "cable", d: cablePath(MAC_PORT, [x, y - 4]) }, cables);
    S.radios[name] = { ...r, name, x, y, node, cable, top: [x, y - radioHeight(r.board)] };
  });
  // the phone's own USB cable (devicectl / adb)
  S.phoneCable = el("path", { class: "cable", d: phoneCablePath(phoneX) }, cables);
}
function rank(r) { return (r.protocol === "meshcore" ? 10 : 0) + (r.role === "base" ? 0 : 1); }
function movePhone(x) {
  const dx = x - 704;
  $("phone").setAttribute("transform", `translate(${dx} 0)`);
  for (const id of ["phoneName", "phoneSub"]) $(id).setAttribute("x", x);
  PHONE_PORT[0] = x;
}
function cablePath([x1, y1], [x2, y2]) {
  const mid = Math.max(y1, y2) + 18;
  return `M${x1} ${y1} C ${x1 + 50} ${mid + 14}, ${x2 - 30} ${mid + 4}, ${x2} ${y2 + 2}`;
}
function phoneCablePath(px) {
  return `M${MAC_PORT[0]} ${MAC_PORT[1] + 4} C 330 476, ${px - 140} 476, ${px - 30} 470`;
}
function radioHeight(board) { return K * (board === "heltec-v3" ? 118 : board === "wio-tracker-l1" ? 92 : 104); }

function drawRadio(parent, name, r, x, y) {
  const g = el("g", { class: "radio", "data-name": name }, parent);
  const scaled = el("g", { transform: `translate(${x} ${y}) scale(${K}) translate(${-x} ${-y})` }, g);
  const body = el("g", { class: "body" }, scaled);
  if (r.board === "heltec-v3") {
    // board with an OLED and a coil antenna

// ---------------------------------------------------------------- effects
const fx = () => $("fx");

function pulseAlong(path, { color = "#ff6000", n = 3, dur = 900, reverse = false, r = 5 } = {}) {
  if (instant || reduced || !path) return;
  const len = path.getTotalLength();
  for (let i = 0; i < n; i++) {
    const dot = el("circle", { r, fill: color }, fx());
    const start = performance.now() + i * (dur / n / 1.4);
    const step = (now) => {
      const k = (now - start) / dur;
      if (k < 0) { dot.setAttribute("opacity", 0); return requestAnimationFrame(step); }
      if (k >= 1) return dot.remove();
      const p = path.getPointAtLength((reverse ? 1 - k : k) * len);
      dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
      dot.setAttribute("opacity", Math.min(1, 4 * Math.min(k, 1 - k) + .2));
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}

// a USB conversation: dots run along the radio's cable until it ends
const usbTimers = {};
function usbStart(name, color = "#5c4f3c", fast = false) {

  r.cable.classList.add("hot"); r.node.classList.add("busy"); r.node.classList.remove("dim");
  clearInterval(usbTimers[name]);
  const go = () => { pulseAlong(r.cable, { color, n: 2, dur: fast ? 650 : 1100 }); pulseAlong(r.cable, { color, n: 1, dur: fast ? 650 : 1100, reverse: true, r: 4 }); };
  go(); usbTimers[name] = setInterval(go, fast ? 420 : 900);

}

// LoRa: rings from a radio, and a packet hop between two radios
function loraRings(name, color = "#ff6000") {

function icon(kind, small = false) {

  s.setAttribute("viewBox", "0 0 30 30"); s.setAttribute("class", "icon" + (small ? " small" : "") + (instant ? " instant" : ""));

const norm = (s) => s.replace(/\(.*?\)/g, "").replace(/\[.*?\]/g, "").replace(/\d+(\.\d+)?/g, "#").replace(/\s+/g, " ").trim().toLowerCase();

function buildList(names, expected) {
  const list = $("list"); list.replaceChildren();
  S.order = names; S.scen = {};
  for (const n of names) {
    const [title, desc] = SCEN[n] || [n, ""];
    const wrap = html("div", "scen");
    const head = html("div", "shead");
    const ic = html("div"); ic.appendChild(icon("pending"));
    const txt = html("div");

    const p = html("p", "", desc); txt.appendChild(p);
    txt.appendChild(html("span", "slug", n));
    const dur = html("div", "dur", "");

    wrap.append(head, ul);
    head.addEventListener("click", () => wrap.classList.toggle("open"));
    list.appendChild(wrap);
    S.scen[n] = { wrap, ic, dur, ul, state: "pending", pass: 0, fail: 0, expected: exp.length, t0: null };
  }

  const fin = Object.values(S.scen).filter((s) => ["pass", "fail", "skipped"].includes(s.state)).length;

    const row = checkRow(e.name, e.ok ? "pass" : "fail", e.ok ? "" : e.detail);
    if (!instant) row.classList.add("new");
    if (li) li.replaceWith(row);
    else {
      const lastDone = [...sc.ul.querySelectorAll("li:not(.pending)")].pop();
      if (lastDone) lastDone.after(row); else sc.ul.prepend(row);
      S.total += 1; sc.expected += 1;
    }
    if (e.ok) { S.pass++; sc.pass++; } else { S.fail++; sc.fail++; sc.wrap.classList.add("open"); }
    if (!instant) scrollList(row);
    if (S.replayOf) ticker(`${e.ok ? "ok  " : "FAIL"} ${e.name}${e.ok || !e.detail ? "" : "  [" + e.detail + "]"}`);
    updateSummary();
    // a bubble over whatever the check is about
    const n = e.name.toLowerCase();
    const role = /^base\b|base (radio|node|admin|beacon|setup|snapshot)/.test(n) ? "base" : /^mobile\b|mobile (radio|node|snapshot)/.test(n) ? "mobile" : null;
    const target = role && S.radios[radioFor(role, e.scenario)];
    if (target) { popAt(target.top[0] + 30, target.top[1] - 4, e.ok); if (!e.ok) failAt(target); }
    else popAt(PHONE_PORT[0] + 52, 70, e.ok);
    if (!e.ok) phoneFail();
    phoneText((SCEN[S.current] || [S.current || ""])[0], e.name);
    // a replay has no USB/BLE events: suggest them from the check
    if (!S.sawTraffic) suggestFromCheck(n, e.scenario);
  },

  cmd(e) {
    if (e.phase === "start") {
      S.sawTraffic = true;
      const c = e.cmd, a = e.args || {};
      phoneText((SCEN[S.current] || [S.current || "Bench"])[0], c);
      termLine(`> ${c}`);
      pulseAlong(S.phoneCable, { color: "#5c4f3c", n: 2, dur: 700 });
      if (c === "radio.scan") scanSweep();
      else if (/setupBase|grantRemote/.test(c)) blePulse(radioFor("base"));
      else if (/Mobile|radio\.(connect|reconnect|settings|snapshot|queryDevice)|backups\.restore|ble\.removeBond/.test(c)) {
        const name = a.name && /base/i.test(a.name) ? radioFor("base") : radioFor("mobile");
        blePulse(name);
      } else if (c === "radio.setRemoteLora") { blePulse(radioFor("mobile")); loraHop(radioFor("mobile"), radioFor("base"), { back: true }); }
      else if (c === "ping") loraHop(radioFor("mobile"), radioFor("base"), { back: true });
      else if (c === "radio.disconnect") bleLink(null, "off");
    } else if (e.ok === false) {
      phoneFail(); phoneText((SCEN[S.current] || [""])[0], "failed: " + (e.error || e.cmd));
    }
  },

  app(e) {
    const d = e.data || {}, k = e.kind;
    S.sawTraffic = true;
    if (k === "link") {
      if (d.state === "ready") { const t = S.bleTarget || radioFor("mobile"); bleLink(t, "solid"); phoneText((SCEN[S.current] || [""])[0], "connected " + (d.radio || "")); }
      else if (d.state === "disconnected") { bleLink(null, "off"); phoneText((SCEN[S.current] || [""])[0], "radio disconnected"); }
    } else if (k === "setup") {
      const name = radioFor(d.role === "base" ? "base" : "mobile");
      blePulse(name); phoneText("Radio Setup · " + (d.role || ""), d.step || "");
    } else if (k === "connect" && d.step) {
      phoneText((SCEN[S.current] || [""])[0], d.step);
    } else if (k === "ping") {
      const ok = d.status === "received" || d.status === "implicit";
      loraHop(radioFor("mobile"), radioFor("base"), { back: d.status !== "timeout" && !/^error/.test(d.status || ""), ok });
      phoneText("Ping", `${d.status}${d.snr != null ? " snr " + d.snr : ""}`);
    } else if (k === "beacon") {
      if (!d.absent) loraHop(radioFor("base"), radioFor("mobile"));
      phoneText("Base beacon", d.absent ? "absent" : "heard");
    } else if (k === "range") {
      phoneText("Range", d.state);
      if (d.state === "inRange") loraRings(radioFor("base"), "#3f9a3a");
    } else if (k === "remote") {
      loraHop(radioFor("mobile"), radioFor("base"), { back: true }); phoneText("Remote change", d.step || "");
    } else if (k === "restore") {
      blePulse(radioFor("mobile")); phoneText("Restore", d.step || "");
    } else if (k === "session") {
      phoneText("Session", d.active ? `#${d.id} recording` : "ended");
    }
  },

  usb(e) { S.sawTraffic = true; if (e.phase === "start") usbStart(e.radio); else usbEnd(e.radio, e.ok !== false); },

  flash(e) {
    S.sawTraffic = true;
    const r = S.radios[e.radio];
    if (e.phase === "start") {
      usbStart(e.radio, "#ff6000", true);
      $("nowTitle").textContent = `Flashing ${BOARD[r?.board] || e.radio}`;
      $("nowSub").textContent = fwLabel({ protocol: e.protocol, firmware: e.version });
      if (r) flashRing(r, true);
    } else {
      usbEnd(e.radio, e.ok);
      if (r) {
        flashRing(r, false);
        if (e.ok) { r.firmware = e.version; r.protocol = e.protocol; r.node.querySelector("[data-fw]").textContent = fwLabel(r); popAt(r.top[0] + 30, r.top[1] - 4, true); }
      }
    }
  },

  pairing() {
    const d = $("pairDlg");
    if (instant) return;
    d.animate([{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .75 }, { opacity: 0 }], { duration: 1800 });
    phoneText("Bluetooth", "pairing: tapped Pair");
  },

  log(e) { ticker(e.text); if (/^\s*(ok|FAIL)\b/.test(e.text)) return; if (/rebooting|waiting/.test(e.text)) termLine(e.text.trim()); },

  run_end(e) {
    S.tEnd = e.t;
    for (const n of Object.keys(usbTimers)) usbEnd(n);
    $("links").replaceChildren();
    const ok = !!e.passed;
    if (!S.combos.length) stamp(ok, e.error);
    $("nowTitle").textContent = e.error ? "Could not start" : ok ? "All checks passed" : "Run failed";
    $("nowSub").textContent = e.error || (S.fail ? `${S.fail} check${S.fail === 1 ? "" : "s"} failed` : `${S.pass} checks in ${fmtDur(S.tEnd - S.t0)}`);
    phoneIcon(ok ? "pass" : "fail");
    phoneText(ok ? "All passed" : "Failed", e.report ? String(e.report).split("/").pop() : "");
    updateSummary();
    if (S.replayOf) $("again").classList.add("on");
  },
};

// keep a row in view inside the checklist only (never scroll the page)
function scrollList(node) {
  const list = $("list"), a = node.getBoundingClientRect(), b = list.getBoundingClientRect();
  if (a.bottom > b.bottom - 8) list.scrollBy({ top: a.bottom - b.bottom + 48, behavior: reduced ? "auto" : "smooth" });
  else if (a.top < b.top) list.scrollBy({ top: a.top - b.top - 8, behavior: reduced ? "auto" : "smooth" });
}
function fmtDur(s) { s = Math.round(s || 0); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; }
function comboState(i, st) { const n = document.querySelector(`.combo[data-i="${i}"]`); if (n) n.className = "combo " + st; }

function flashRing(r, on) {
  const id = "ring-" + r.name; document.getElementById(id)?.remove();
  if (!on) return;
  const [x, y] = [r.x, r.y - radioHeight(r.board) / 2];
  const g = el("g", { id }, r.node);
  el("circle", { cx: x, cy: y, r: 58, class: "ring", stroke: "#f3ede2" }, g);
  const sp = el("g", { class: "spin" }, g);
  el("circle", { cx: x, cy: y, r: 58, fill: "none", stroke: "none" }, sp);
  el("path", { d: `M${x} ${y - 58} A58 58 0 0 1 ${x + 58} ${y}`, class: "ring", stroke: "#ff6000", "stroke-linecap": "round" }, sp);
}

function stamp(ok, err) {
  const L = $("stampLayer"); L.replaceChildren();
  const g = el("g", { class: instant ? "" : "stamp", transform: instant ? "rotate(-6 450 190)" : "" }, L);
  const text = err ? "NOT RUN" : ok ? "PASSED" : "FAILED";
  el("rect", { x: 300, y: 150, width: 300, height: 82, rx: 8, fill: ok ? "#3f9a3a" : "#a3271b", stroke: "#261f15", "stroke-width": 4 }, g);
  const t = el("text", { x: 450, y: 207, "text-anchor": "middle", "font-family": "Familjen Grotesk, DM Sans, system-ui", "font-weight": 700, "font-size": 50, fill: "#fff", "letter-spacing": "2" }, g);
  t.textContent = text;
  if (ok && !instant && !reduced) confetti();
}
function confetti() {
  const cols = ["#3f9a3a", "#8cc63f", "#f2c230", "#ff6000", "#3b6ea8"];
  for (let i = 0; i < 46; i++) {
    const c = el("rect", { x: 450, y: 190, width: 7, height: 7, rx: 1.5, fill: cols[i % cols.length] }, fx());
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 220;
    c.animate([{ transform: "translate(0,0) rotate(0)", opacity: 1 },
               { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist * .6 + 160}px) rotate(${360 * Math.random()}deg)`, opacity: 0 }],
      { duration: 1600 + Math.random() * 900, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => c.remove();
  }
}

// A replayed report has checks but no traffic: animate what the check names say.
function suggestFromCheck(n, scenario) {
  const base = radioFor("base", scenario), mobile = radioFor("mobile", scenario);
  if (/ble|bluetooth|seen over|connected|reconnect|setup reported|roles/.test(n)) { blePulse(/base/.test(n) ? base : mobile); return; }
  if (/ping|beacon|range|trace|nak|answered|telemetry/.test(n)) { loraHop(mobile, base, { back: true, ok: true }); return; }
  if (/^base:/.test(n)) { usbStart(base); setTimeout(() => usbEnd(base), 700); return; }
  if (/^mobile:/.test(n)) { usbStart(mobile); setTimeout(() => usbEnd(mobile), 700); return; }
  pulseAlong(S.phoneCable, { color: "#5c4f3c", n: 1, dur: 700 });
}

function apply(e) {
  const f = H[e.type]; if (!f) return;
  instant = !!e.replay;
  try { f(e); } catch (err) { console.error(e.type, err); }
  instant = false;
}

// ---------------------------------------------------------------- feed
phoneIcon("idle"); phoneText("Waiting", "");
drawBench({});
let es;
function connect() {
  const conn = $("conn");
  es = new EventSource("/feed");
  es.onopen = () => { conn.className = "conn live"; conn.lastElementChild.textContent = "live"; };
  es.onerror = () => { conn.className = "conn lost"; conn.lastElementChild.textContent = "bench not reachable"; };
  es.onmessage = (m) => { try { apply(JSON.parse(m.data)); } catch (err) { console.error(err); } };
}
connect();
$("again").addEventListener("click", () => fetch("/replay", { method: "POST" }));
</script>
